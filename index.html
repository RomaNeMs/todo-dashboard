// ---------- BLOCK COLLAPSE (click the header line to fold/unfold its notes) ----------
function toggleBlock(ev, bid) {
  // Ignore clicks on the action buttons, drag handle, or a title mid-edit
  if (ev.target.closest(".note-act") || ev.target.closest(".hblock-drag-handle")) return;
  if (ev.target.closest(".hblock-title.editing")) return;
  // Ignore the click that trails a horizontal swipe on iPhone
  if (Date.now() - _lastSwipeTs < 400) return;
  state.daily.blockCollapsed = state.daily.blockCollapsed || {};
  state.daily.blockCollapsed[bid] = !state.daily.blockCollapsed[bid];
  save(); renderDaily();
}

// ---------- GATED EDITING (Edit button → editable; blur/Enter → read-only) ----------
function _enterEdit(el, selectAll = false) {
  if (!el) return;
  closeNoteSwipe();
  el.setAttribute("contenteditable", "true");
  el.classList.add("editing");
  // Focus SYNCHRONOUSLY — iOS only opens the keyboard while the tap's
  // user-activation is still live. Caret at the end, or select-all so
  // typing replaces (new headers).
  void el.offsetHeight; // layout flush so focus lands on first try
  el.focus();
  try {
    const r = document.createRange();
    r.selectNodeContents(el);
    if (!selectAll) r.collapse(false);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  } catch (e) { /* ignore */ }
  const done = () => {
    el.removeAttribute("contenteditable");
    el.classList.remove("editing");
  };
  el.addEventListener("blur", done, { once: true });
  el.addEventListener("keydown", function onKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); el.blur(); el.removeEventListener("keydown", onKey); }
    if (e.key === "Escape") { e.preventDefault(); el.blur(); el.removeEventListener("keydown", onKey); }
  });
}
function noteEditStart(sid, bid, idx) {
  const blockEl = document.querySelector(`.hblock[data-block-id="${bid}"]`);
  _enterEdit(blockEl?.querySelector(`.note-inline[data-note-idx="${idx}"] .ntext`));
}
function titleEditStart(bid) {
  _enterEdit(document.querySelector(`.hblock-title[data-block-id="${bid}"]`));
}
function addBlock(sid) {
  const newId = uid("b");
  // Expand the section if collapsed so the new block is visible/focusable
  if (state.daily.sectionCollapsed[sid]) state.daily.sectionCollapsed[sid] = false;
  state.daily.sections.find(s => s.id === sid).blocks.push({ id: newId, title: "New header", notes: [""] });
  save(); renderDaily();
  // Synchronous: renderDaily already put the element in the DOM, and iOS
  // needs the focus to happen inside the tap's user-activation window.
  _enterEdit(document.querySelector(`.hblock-title[data-block-id="${newId}"]`), true);
}
function delBlock(sid, bid) {
  const sec = state.daily.sections.find(s => s.id === sid);
  const idx = sec.blocks.findIndex(b => b.id === bid);
  if (idx < 0) return;
  const removed = sec.blocks.splice(idx, 1)[0];
  save(); renderDaily();
  showUndoToast(`"${removed.title}" removed`, () => {
    sec.blocks.splice(idx, 0, removed);
    save(); renderDaily();

}

// ---------- DAILY BLOCK DRAG & DROP REORDERING ----------
// Drag a block by its ⋮⋮ handle to reorder within the same section.
// Cross-section drags are ignored (different "Accounting" vs "Payroll" data).
let _blockDragSrcSection = null;
let _blockDragSrcId = null;

function onBlockDragStart(ev, sectionId, blockId) {
  _blockDragSrcSection = sectionId;
  _blockDragSrcId = blockId;
  try { ev.dataTransfer.setData("text/plain", blockId); } catch (e) {}
  ev.dataTransfer.effectAllowed = "move";
  const el = ev.target.closest(".hblock");
  if (el) el.classList.add("dragging");
}
function onBlockDragEnd() {
  document.querySelectorAll(".hblock.dragging, .hblock.drag-over").forEach(b => {
    b.classList.remove("dragging");
    b.classList.remove("drag-over");
  });
  _blockDragSrcSection = null;
  _blockDragSrcId = null;
}
function onBlockDragOver(ev) {
  if (!_blockDragSrcId) return;
  const tgt = ev.currentTarget;
  // Only allow drop within the same section
  if (tgt.dataset.sectionId !== _blockDragSrcSection) return;
  if (tgt.dataset.blockId === _blockDragSrcId) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".hblock.drag-over").forEach(b => {
    if (b !== tgt) b.classList.remove("drag-over");
  });
  tgt.classList.add("drag-over");
}
function onBlockDrop(ev, sectionId, targetBlockId) {
  ev.preventDefault();
  document.querySelectorAll(".hblock.drag-over").forEach(b => b.classList.remove("drag-over"));
  const srcId = _blockDragSrcId;
  const srcSection = _blockDragSrcSection;
  _blockDragSrcId = null;
  _blockDragSrcSection = null;
  if (!srcId || srcSection !== sectionId || srcId === targetBlockId) return;
  const sec = state.daily.sections.find(s => s.id === sectionId);
  if (!sec) return;
  const srcIdx = sec.blocks.findIndex(b => b.id === srcId);
  const tgtIdx = sec.blocks.findIndex(b => b.id === targetBlockId);
  if (srcIdx < 0 || tgtIdx < 0) return;
  const [moved] = sec.blocks.splice(srcIdx, 1);
  sec.blocks.splice(tgtIdx, 0, moved);
  save(); renderDaily();
}

// ---------- NOTE REORDER (pointer-based, ported from the personal dashboard) ----------
// Grab the ⠿ handle and drag vertically. Works with mouse (Mac) and touch (iPhone):
// pointer events + touch-action:none on the handle. Measures row midpoints once at
// drag start, highlights the closest row while moving, splices the array on release.
let _nr = null; // { sectionId, blockId, fromIdx, rows: [{idx, el, mid}], overIdx }

function noteReorderStart(ev, sectionId, blockId, idx) {
  ev.preventDefault();
  ev.stopPropagation();
  const blockEl = ev.target.closest(".hblock");
  if (!blockEl) return;
  const rows = [...blockEl.querySelectorAll(".note-inline")].map(el => {
    const r = el.getBoundingClientRect();
    return { idx: +el.dataset.noteIdx, el, mid: r.top + r.height / 2 };
  });
  _nr = { sectionId, blockId, fromIdx: idx, rows, overIdx: idx };
  const src = rows.find(r => r.idx === idx);
  if (src) src.el.classList.add("dragging");
  document.body.style.userSelect = "none";
  window.addEventListener("pointermove", noteReorderMove, { passive: false });
  window.addEventListener("pointerup", noteReorderEnd);
  window.addEventListener("pointercancel", noteReorderEnd);
}
function noteReorderMove(ev) {
  if (!_nr) return;
  ev.preventDefault();
  let best = null, bestDist = Infinity;
  for (const r of _nr.rows) {
    const d = Math.abs(ev.clientY - r.mid);
    if (d < bestDist) { bestDist = d; best = r; }
  }
  if (!best || best.idx === _nr.overIdx) return;
  _nr.overIdx = best.idx;
  _nr.rows.forEach(r => r.el.classList.toggle("drag-over", r.idx === best.idx && r.idx !== _nr.fromIdx));
}
function noteReorderEnd() {
  window.removeEventListener("pointermove", noteReorderMove);
  window.removeEventListener("pointerup", noteReorderEnd);
  window.removeEventListener("pointercancel", noteReorderEnd);
  document.body.style.userSelect = "";
  if (!_nr) return;
  const { sectionId, blockId, fromIdx, overIdx, rows } = _nr;
  rows.forEach(r => r.el.classList.remove("dragging", "drag-over"));
  _nr = null;
  if (fromIdx === overIdx) return;
  const blk = state.daily.sections.find(s => s.id === sectionId)?.blocks.find(b => b.id === blockId);
  if (!blk) return;
  const [moved] = blk.notes.splice(fromIdx, 1);
  blk.notes.splice(overIdx, 0, moved);
  save(); renderDaily();
}

// ---------- NOTE SWIPE (iPhone: swipe a note left to reveal Edit + Delete) ----------
// Same pattern as the personal dashboard's item rows: direction-lock so vertical
// scrolling stays native; the body slides over absolutely-positioned Edit/Delete
// buttons; release past halfway snaps open, otherwise snaps shut.
// Swipe-open distance is measured per row from its .note-actions width
// (2 buttons on notes/headers, 3 on tasks). 112 is the fallback.
function _swipeOpenX(body) {
  const acts = body.parentElement.querySelector(".note-actions");
  return (acts && acts.offsetWidth) ? -acts.offsetWidth : null;
}
let _ns = null;              // in-flight gesture { body, startX, startY, openAt, locked, x }
let _nsOpenBody = null;      // the one row currently left open, if any
let _lastSwipeTs = 0;        // when the last horizontal swipe ended (suppresses its trailing click)

function noteSwipeStart(ev) {
  if (!document.body.classList.contains("is-mobile")) return;
  if (ev.target.closest(".note-grab") || ev.target.closest(".hblock-drag-handle")) return; // drag handles own their touch
  const body = ev.currentTarget;
  if (_nsOpenBody && _nsOpenBody !== body) closeNoteSwipe();
  const t = ev.touches[0];
  const openW = _swipeOpenX(body); // measurable only if already open (display:none otherwise)
  _ns = { body, startX: t.clientX, startY: t.clientY, open: openW,
          openAt: (body === _nsOpenBody && openW) ? openW : 0, locked: null, x: 0 };
}
function noteSwipeMove(ev) {
  if (!_ns) return;
  const t = ev.touches[0];
  const dx = t.clientX - _ns.startX, dy = t.clientY - _ns.startY;
  if (_ns.locked === null) {
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    _ns.locked = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
  }
  if (_ns.locked !== "h") return;
  ev.preventDefault();
  _ns.body.parentElement.classList.add("swipe-active");
  if (_ns.open === null) _ns.open = _swipeOpenX(_ns.body) || -112;
  _ns.x = Math.max(_ns.open, Math.min(0, _ns.openAt + dx));
  _ns.body.style.transform = `translateX(${_ns.x}px)`;
}
function noteSwipeEnd() {
  if (!_ns) return;
  if (_ns.locked === "h") _lastSwipeTs = Date.now();
  const settled = _ns.locked === "h" ? _ns.x : _ns.openAt;
  if (_ns.open !== null && settled < _ns.open / 2) {
    _ns.body.style.transform = `translateX(${_ns.open}px)`;
    _nsOpenBody = _ns.body;
  } else {
    _ns.body.style.transform = "";
    _ns.body.parentElement.classList.remove("swipe-active");
    if (_nsOpenBody === _ns.body) _nsOpenBody = null;
  }
  _ns = null;
}
function closeNoteSwipe() {
  if (!_nsOpenBody) return;
  _nsOpenBody.style.transform = "";
  _nsOpenBody.parentElement.classList.remove("swipe-active");
  _nsOpenBody = null;
}
// Tapping anywhere else closes an open swipe row
document.addEventListener("touchstart", ev => {
  if (_nsOpenBody && !_nsOpenBody.parentElement.contains(ev.target)) closeNoteSwipe();
}, true);
function updBlockTitle(sid, bid, t) {
  state.daily.sections.find(s => s.id === sid).blocks.find(b => b.id === bid).title = sanitizeRichText(t);
  save();
}
function addNote(sid, bid) {
  const blk = state.daily.sections.find(s => s.id === sid).blocks.find(b => b.id === bid);
  blk.notes.push("");
  save(); renderDaily();
  // Open the new (last) note in edit mode so the keyboard is ready.
  // Synchronous — same iOS user-activation constraint as addBlock.
  noteEditStart(sid, bid, blk.notes.length - 1);
}
function delNote(sid, bid, i) {
  const blk = state.daily.sections.find(s => s.id === sid).blocks.find(b => b.id === bid);
  const removed = blk.notes.splice(i, 1)[0];

    blk.notes.splice(i, 0, removed);
    save(); renderDaily();

}
function updNote(sid, bid, i, t) {
  state.daily.sections.find(s => s.id === sid).blocks.find(b => b.id === bid).notes[i] = sanitizeRichText(t);
  save();

// ---------- PROCEDURE DRAG & DROP REORDERING ----------
let _procDragSourceId = null;

function onProcDragStart(ev, id) {
  _procDragSourceId = id;
  try { ev.dataTransfer.setData("text/plain", id); } catch (e) {}
  ev.dataTransfer.effectAllowed = "move";
  const bubble = ev.target.closest(".proc-bubble");
  if (bubble) bubble.classList.add("dragging");
}
function onProcDragEnd(ev) {
  document.querySelectorAll(".proc-bubble.dragging, .proc-bubble.drag-over")
    .forEach(b => { b.classList.remove("dragging"); b.classList.remove("drag-over"); });
  _procDragSourceId = null;
}
function onProcDragOver(ev) {
  if (!_procDragSourceId) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  const bubble = ev.currentTarget;
  if (!bubble || bubble.dataset.procId === _procDragSourceId) return;
  document.querySelectorAll(".proc-bubble.drag-over").forEach(b => {
    if (b !== bubble) b.classList.remove("drag-over");
  });
  bubble.classList.add("drag-over");
}
function onProcDrop(ev, targetId) {
  ev.preventDefault();
  document.querySelectorAll(".proc-bubble.drag-over").forEach(b => b.classList.remove("drag-over"));
  const srcId = _procDragSourceId;
  _procDragSourceId = null;
  if (!srcId || srcId === targetId) return;
  const procs = state.info.procedures;
  const srcIdx = procs.findIndex(p => p.id === srcId);
  const tgtIdx = procs.findIndex(p => p.id === targetId);
  if (srcIdx < 0 || tgtIdx < 0) return;
  const [moved] = procs.splice(srcIdx, 1);
  procs.splice(tgtIdx, 0, moved);
  save(); renderInfo();
}

// Double-click to edit pattern for Info-tab fields
function applyDblEditUpdate(path, txt, opts) {
  // opts.commit = true means user finished editing (focusout) — apply unit normalization + re-render
  // opts.commit = false (or omitted) means we're saving mid-typing — just persist state, no re-render
  const isCommit = opts && opts.commit === true;
  const parts = path.split(":");

  if (parts[0] === "bankName") {
    const bi = +parts[1];
    if (state.info.banks[bi]) state.info.banks[bi].name = txt;
  } else if (parts[0] === "bankRow") {
    const bi = +parts[1], ri = +parts[2], field = parts[3];
    if (state.info.banks[bi]?.rows[ri]) state.info.banks[bi].rows[ri][field] = txt;
  } else if (parts[0] === "contact") {
    const group = parts[1], i = +parts[2], field = parts[3];
    if (state.info.contacts[group]?.[i]) state.info.contacts[group][i][field] = txt;
  } else if (parts[0] === "proc") {
    const p = state.info.procedures.find(x => x.id === parts[1]);
    if (p) p[parts[2]] = txt;
  } else if (parts[0] === "person") {
    const secId = parts[1], i = +parts[2], field = parts[3];
    const sec = state.daily.sections.find(s => s.id === secId);
    if (sec?.people?.[i]) sec.people[i][field] = txt;
    // Re-render only on commit so we don't lose cursor while typing
    if (isCommit) renderDaily();
  } else if (parts[0] === "cadKv") {
    const secId = parts[1], itemId = parts[2], field = parts[3];
    const sec = state.cadence.sections.find(s => s.id === secId);
    if (sec) {
      const it = sec.items.find(i => i.id === itemId);
      if (it) {
        if (field === "value" && it.unit && isCommit) {
          // Auto-format with unit only on commit
          const num = String(txt).replace(/[^\d.]/g, "");
          if (num === "") it.value = "";
          else if (it.unit === "₪") it.value = "₪" + num;
          else if (it.unit === "%") it.value = num + "%";
          else it.value = num + it.unit;
          save();
          renderCadence();
          return;
        } else {
          it[field] = txt;
        }
      }
    }
  }
  save();
}
document.addEventListener("dblclick", e => {
  const el = e.target.closest(".dbl-edit");
  if (!el || el.contentEditable === "true") return;
  // Cancel any pending click-to-copy on this element
  if (el._clickTimer) { clearTimeout(el._clickTimer); el._clickTimer = null; }
  el.contentEditable = "true";
  el.focus();
  const r = document.createRange();
  r.selectNodeContents(el);
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
});
// Read text from a dbl-edit field — innerHTML for rich-edit (preserves bold / strike),
// innerText for plain dbl-edit fields.
function _readDblEdit(el) {
  if (el.classList.contains("rich-edit")) {
    return sanitizeRichText(el.innerHTML);
  }
  return el.innerText;
}
// Save on every keystroke so changes survive a refresh even mid-edit
document.addEventListener("input", e => {
  const el = e.target.closest && e.target.closest(".dbl-edit");
  if (!el || el.contentEditable !== "true") return;
  if (el.dataset.update) applyDblEditUpdate(el.dataset.update, _readDblEdit(el), { commit: false });
});
document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest(".dbl-edit");
  if (!el || el.contentEditable !== "true") return;
  el.contentEditable = "false";
  if (el.dataset.update) {
    const txt = _readDblEdit(el);
    applyDblEditUpdate(el.dataset.update, txt, { commit: true });
    // If a contact phone was emptied, re-render Info so the "+ phone" button shows again
    if (/^contact:[^:]+:\d+:phone$/.test(el.dataset.update) && !txt.trim()) {
      renderInfo();
    }
  }
});
document.addEventListener("keydown", e => {
  if (!e.target.classList || !e.target.classList.contains("dbl-edit")) return;
  if (e.target.contentEditable !== "true") return;
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.target.blur(); }
  if (e.key === "Escape") { e.preventDefault(); e.target.blur(); }
});

// ---------- CADENCE ----------
function ymKey(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function fmtDate(d) { return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0"); }
function sameDay(a, b) { return a.toDateString() === b.toDateString(); }
function dueDateForDay(day) {
  const today = new Date();
  return new Date(today.getFullYear(), today.getMonth(), day);
}
function statusFor(item) {
  const today = new Date();
  const due = dueDateForDay(item.dueDay);
  const completed = (state.cadence.completions[ymKey(today)] || {})[item.id];
  if (completed) return { cls: "green", label: "Done" };
  if (today > due && !sameDay(today, due)) return { cls: "red", label: "Overdue (" + fmtDate(due) + ")" };
  if (sameDay(today, due)) return { cls: "amber", label: "Due today" };
  return { cls: "", label: "Due " + fmtDate(due) };
}

function renderCadence() {
  const root = document.getElementById("pane-cadence");
  const today = new Date();

  root.innerHTML = "";

  state.cadence.sections.forEach(sec => {
    const collapsed = !!state.cadence.collapsed[sec.id];
    const wrap = document.createElement("div");
    wrap.className = "section" + (collapsed ? " collapsed" : "");
    const head = document.createElement("div");
    head.className = "section-head";
    head.onclick = () => toggleCadSection(sec.id);

    if (sec.type === "checklist") {
      const done = sec.items.filter(i => (state.cadence.completions[ymKey(today)]||{})[i.id]).length;
      head.innerHTML = `
        <div class="title-area">
          <span>${escapeHtml(sec.title)}</span>
          <button class="copybtn" style="font-size:10px; padding:2px 8px;" onclick="event.stopPropagation(); resetMonthEnd('${sec.id}')" title="Clear all checks for this month">Reset</button>
        </div>
        <div class="head-right">
          <span class="meta">${done}/${sec.items.length}</span>
          <button class="icard-add" onclick="event.stopPropagation(); addCadItem('${sec.id}')" title="Add task">+</button>
          <span class="chev">▾</span>
        </div>
      `;
    } else {
      head.innerHTML = `
        <div class="title-area">
          <span>${escapeHtml(sec.title)}</span>
        </div>
        <div class="head-right">
          <span class="meta">${sec.items.length}</span>
          <button class="icard-add" onclick="event.stopPropagation(); addCadItem('${sec.id}')" title="Add entry">+</button>
          <span class="chev">▾</span>
        </div>
      `;
    }
    wrap.appendChild(head);

    const body = document.createElement("div");
    body.className = "section-body";
    sec.items.forEach(item => body.appendChild(renderCadItem(sec, item)));
    wrap.appendChild(body);

    root.appendChild(wrap);
  });
}
function toggleCadSection(id) {
  state.cadence.collapsed[id] = !state.cadence.collapsed[id];
  save(); renderCadence();
}
function resetMonthEnd(secId) {
  const sec = state.cadence.sections.find(s => s.id === secId);
  if (!sec) return;
  const k = ymKey(new Date());
  if (!state.cadence.completions[k]) return;
  // Snapshot for undo
  const snapshot = {};
  sec.items.forEach(it => {
    if (state.cadence.completions[k][it.id]) {
      snapshot[it.id] = state.cadence.completions[k][it.id];
      delete state.cadence.completions[k][it.id];
    }
  });
  if (Object.keys(snapshot).length === 0) { toast("Nothing to reset"); return; }
  save(); renderCadence();
  showUndoToast(`${Object.keys(snapshot).length} item(s) reset`, () => {
    state.cadence.completions[k] = state.cadence.completions[k] || {};
    Object.assign(state.cadence.completions[k], snapshot);
    save(); renderCadence();
  });
}

// ---------- CALCULATOR (floating, draggable, no total) ----------
if (!state.calcPos) state.calcPos = { x: null, y: null };
let calcRows = [];
let dragOffset = null;

function placeCalcWindow() {
  const win = document.getElementById("calcWindow");
  let x = state.calcPos.x, y = state.calcPos.y;
  if (x === null || y === null) {
    x = Math.max(20, window.innerWidth - 340);
    y = 80;
  }
  win.style.left = x + "px";
  win.style.top = y + "px";
}
function toggleCalcWindow() {
  const win = document.getElementById("calcWindow");
  const btn = document.getElementById("calcToggle");
  const wasOpen = win.classList.contains("open");
  win.classList.toggle("open");
  btn.classList.toggle("active");
  if (!wasOpen) {
    placeCalcWindow();
    setTimeout(() => document.getElementById("calcExpr").focus(), 0);
  }
}
function evalMath(expr) {
  if (!expr || !/^[\d\.\+\-\*\/\(\)\s,xX]+$/.test(expr)) return NaN;
  const cleaned = expr.replace(/[xX]/g, "*").replace(/,/g, "");
  try {
    const r = Function('"use strict"; return (' + cleaned + ')')();
    return typeof r === "number" && isFinite(r) ? r : NaN;
  } catch (e) { return NaN; }
}
function fmtMoney(n) {
  return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function updateCalcLive() {
  const input = document.getElementById("calcExpr");
  const out = document.getElementById("calcLive");
  const val = (input.value || "").trim();
  if (!val) { out.textContent = ""; out.classList.remove("error"); return; }
  const r = evalMath(val);
  if (isNaN(r)) { out.textContent = "?"; out.classList.add("error"); }
  else { out.textContent = "= " + fmtMoney(r); out.classList.remove("error"); }
}
function commitCalc() {
  const input = document.getElementById("calcExpr");
  const val = (input.value || "").trim();
  if (!val) return;
  const r = evalMath(val);
  if (isNaN(r)) return;
  calcRows.push({ expr: val, result: r });
  input.value = "";
  document.getElementById("calcLive").textContent = "";
  renderCalc();
}
function renderCalc() {
  const list = document.getElementById("calcList");
  if (!calcRows.length) {
    list.innerHTML = `<div class="calc-empty">Type an expression, press Enter</div>`;
    return;
  }
  list.innerHTML = calcRows.map((r, i) => `
    <div class="calc-row">
      <span class="expr">${escapeHtml(r.expr)}</span>
      <span class="result">${fmtMoney(r.result)}</span>
      <button class="del" onclick="delCalcRow(${i})">×</button>
    </div>
  `).join("");
}
function delCalcRow(i) { calcRows.splice(i, 1); renderCalc(); }
function clearCalc() {
  if (!calcRows.length) {
    document.getElementById("calcExpr").value = "";
    document.getElementById("calcLive").textContent = "";
    return;
  }
  const snapshot = calcRows.slice();
  calcRows = [];
  document.getElementById("calcExpr").value = "";
  document.getElementById("calcLive").textContent = "";
  renderCalc();
  showUndoToast(`Cleared ${snapshot.length} calculator row(s)`, () => {
    calcRows = snapshot;
    renderCalc();
  });
}

// Drag handler — pointer events for mouse + touch
function startCalcDrag(ev) {
  const win = document.getElementById("calcWindow");
  const rect = win.getBoundingClientRect();
  dragOffset = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  document.addEventListener("pointermove", doCalcDrag);
  document.addEventListener("pointerup", endCalcDrag);
  document.addEventListener("pointercancel", endCalcDrag);
  ev.preventDefault();
}
function doCalcDrag(ev) {
  if (!dragOffset) return;
  const win = document.getElementById("calcWindow");
  const rect = win.getBoundingClientRect();
  let nx = Math.max(0, Math.min(window.innerWidth - rect.width, ev.clientX - dragOffset.x));
  let ny = Math.max(0, Math.min(window.innerHeight - rect.height, ev.clientY - dragOffset.y));
  win.style.left = nx + "px";
  win.style.top = ny + "px";
}
function endCalcDrag() {
  if (!dragOffset) return;
  dragOffset = null;
  document.removeEventListener("pointermove", doCalcDrag);
  document.removeEventListener("pointerup", endCalcDrag);
  document.removeEventListener("pointercancel", endCalcDrag);
  const win = document.getElementById("calcWindow");
  state.calcPos = { x: parseInt(win.style.left, 10), y: parseInt(win.style.top, 10) };
  save();
}

// Calc keyboard: live-eval on input, Enter commits, Cmd-K toggles, Esc closes
document.addEventListener("input", e => {
  if (e.target.id === "calcExpr") updateCalcLive();
});
document.addEventListener("keydown", e => {
  if (e.target.id === "calcExpr" && e.key === "Enter") {
    e.preventDefault(); commitCalc(); return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault(); toggleCalcWindow();
  }
  if (e.key === "Escape" && document.getElementById("calcWindow").classList.contains("open")) {
    toggleCalcWindow();
  }
});

// ---------- BANK BALANCE (pushed from cash flow dashboard) ----------
function refreshBankBalance() {
  if (!isServerEnabled()) return;
  apiFetch("getLatestBalance")
    .then(b => {
      const pair = document.getElementById("balancePair");
      const val = document.getElementById("bankBalance");
      if (!b || typeof b.balance !== "number") {
        pair.style.display = "none";
        return;
      }
      const formatted = b.balance.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
      val.textContent = "₪" + formatted;
      // Mark stale if older than 24h
      const ageHrs = b.timestamp ? (Date.now() - new Date(b.timestamp).getTime()) / 36e5 : 99;
      val.classList.toggle("stale", ageHrs > 24);
      val.title = "Last push: " + (b.timestamp ? new Date(b.timestamp).toLocaleString() : "—") +
                  (b.label ? " · " + b.label : "");
      pair.style.display = "";
    })
    .catch(err => console.warn("Balance fetch failed:", err));
}

// Initial fetch
refreshBankBalance();
</script>
